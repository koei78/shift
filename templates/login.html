{% extends "base.html" %}
{% block content %}

<style>
  .login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 120px);
    padding: 24px 16px;
  }

  .login-card {
    background: #ffffff;
    border: 1px solid #e4e4e7;
    border-radius: 14px;
    padding: 36px 32px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
    text-align: center;
  }

  .login-header { margin-bottom: 28px; }

  .login-header .login-icon-wrap {
    width: 56px;
    height: 56px;
    background: #e0f2fe;
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .login-header .login-icon-wrap i {
    font-size: 26px;
    color: #0ea5e9;
  }
  .login-header h2 {
    margin: 0 0 4px 0;
    font-size: 22px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.01em;
  }

  .login-form-group {
    text-align: left;
    margin-bottom: 16px;
  }
  .login-form-group label {
    display: block;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
    font-size: 13.5px;
  }

  .login-input {
    width: 100%;
    padding: 10px 13px;
    border-radius: 8px;
    border: 1px solid #e4e4e7;
    font-size: 14.5px;
    background: #fafafa;
    color: #111827;
    transition: border-color 0.15s, box-shadow 0.15s;
    box-sizing: border-box;
  }
  .login-input:focus {
    outline: none;
    border-color: #0ea5e9;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(14,165,233,0.15);
  }

  .login-btn {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    margin-top: 8px;
    border-radius: 8px;
  }

  .login-footer {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid #f4f4f5;
    font-size: 12.5px;
    color: #71717a;
    line-height: 1.7;
  }
  .login-footer strong { color: #52525b; }
</style>

<div class="login-container">
  <div class="login-card">
    
    <div class="login-header">
      <div class="login-icon-wrap">
        <i class="fa-solid fa-clipboard-list"></i>
      </div>
      <h2>DigiNest</h2>
      <p class="muted" style="margin-top: 6px; font-size: 13.5px;">アカウントにログインしてください</p>
    </div>

    <form method="post">
      <div class="login-form-group">
        <label for="email"><i class="fa-regular fa-envelope"></i> メールアドレス</label>
        <input id="email" name="email" class="login-input" type="email" placeholder="admin@example.com" required autofocus>
      </div>
      
      <div class="login-form-group">
        <label for="password"><i class="fa-solid fa-lock"></i> パスワード</label>
        <input id="password" name="password" class="login-input" type="password" placeholder="••••••••" required>
      </div>

      <button class="btn primary login-btn" type="submit">
        ログイン <i class="fa-solid fa-arrow-right-to-bracket" style="margin-left:8px;"></i>
      </button>

      <div class="login-footer">
        テスト用初期アカウント:<br>
        <strong>Email:</strong> admin@example.com<br>
        <strong>Pass:</strong> admin123
      </div>
    </form>
    
  </div>
</div>

{% endblock %}
